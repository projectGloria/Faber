<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#232327" stroke-width="2" />

  <!-- Subtle architectural grid lines -->
  <g stroke="#232327" stroke-opacity="0.45" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
  </g>

  <!-- Real Faber anvil-F app icon mark (from app-icon.svg) -->
  <g transform="translate(88, 76) scale(0.328125)">
    <rect width="512" height="512" rx="112" fill="#17171a" stroke="#232327" stroke-width="10" />
    <path d="M150 128h220v64H226v52h120v62H226v78h-76z" fill="url(#accent)" />
    <rect x="300" y="352" width="70" height="32" rx="8" fill="#f59e0b" opacity="0.55" />
  </g>

  <!-- Title & tagline -->
  <text x="296" y="142" fill="#e4e4e7" font-family="'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.02em">Faber</text>
  <text x="298" y="186" fill="#8b8b94" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">Drop a project folder. Detect the stack, install what's missing, build in one click.</text>

  <!-- Stack pills (from Faber's real stack colors in src/styles.css) -->
  <g transform="translate(298, 218)" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="62" height="28" rx="6" fill="#22d3ee" fill-opacity="0.14" />
    <text x="31" y="19" text-anchor="middle" fill="#67e8f9">Tauri</text>

    <rect x="72" y="0" width="80" height="28" rx="6" fill="#60a5fa" fill-opacity="0.14" />
    <text x="112" y="19" text-anchor="middle" fill="#93c5fd">Electron</text>

    <rect x="162" y="0" width="70" height="28" rx="6" fill="#02569b" fill-opacity="0.24" />
    <text x="197" y="19" text-anchor="middle" fill="#54c5f8">Flutter</text>

    <rect x="242" y="0" width="66" height="28" rx="6" fill="#fb923c" fill-opacity="0.14" />
    <text x="275" y="19" text-anchor="middle" fill="#fdba74">Cargo</text>

    <rect x="318" y="0" width="62" height="28" rx="6" fill="#a78bfa" fill-opacity="0.14" />
    <text x="349" y="19" text-anchor="middle" fill="#c4b5fd">.NET</text>

    <rect x="390" y="0" width="48" height="28" rx="6" fill="#00acd7" fill-opacity="0.14" />
    <text x="414" y="19" text-anchor="middle" fill="#38bdf8">Go</text>

    <rect x="448" y="0" width="74" height="28" rx="6" fill="#facc15" fill-opacity="0.14" />
    <text x="485" y="19" text-anchor="middle" fill="#fde047">Python</text>

    <rect x="532" y="0" width="64" height="28" rx="6" fill="#22c55e" fill-opacity="0.14" />
    <text x="564" y="19" text-anchor="middle" fill="#86efac">Node</text>

    <rect x="606" y="0" width="84" height="28" rx="6" fill="#17171a" stroke="#232327" stroke-width="1" />
    <text x="648" y="19" text-anchor="middle" fill="#8b8b94">+7 more</text>
  </g>
</svg>
